<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Investment Tracker</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <button type="button" class="menu-btn" id="btn-menu" aria-label="Open the menu" aria-expanded="false" aria-controls="drawer">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
    <a href="#/" class="brand">Investment Tracker <span class="version muted" id="app-version" title="App version"></span></a>
  </header>
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Menu" aria-hidden="true">
    <div class="drawer-head"><b>Menu</b><button type="button" class="icon-close" id="btn-menu-close" aria-label="Close the menu">&times;</button></div>
    <div class="actions">
      <a href="#/" class="drawer-item needs-unlock" id="nav-portfolio">Portfolio</a>
      <button type="button" class="drawer-item needs-unlock" id="btn-add-fund-menu" title="Add a mutual fund, stock, NPS, EPF, PPF, gold bond, fixed deposit or policy">+ Add fund / stock</button>
      <button type="button" class="drawer-item needs-unlock" id="btn-refresh" title="Fetch the latest NAVs, stock prices and exchange rates">Refresh prices</button>
      <button type="button" class="drawer-item needs-unlock" id="btn-tax" title="Capital gains, dividends and interest of a financial year, and the estimated tax">Tax</button>
      <button type="button" class="drawer-item needs-unlock" id="btn-print" title="Print the portfolio or a holding, or save it as a PDF">Print</button>
      <button type="button" class="drawer-item needs-unlock" id="btn-cloud" title="Back up the vault to Google Drive, OneDrive or Dropbox">Cloud</button>
      <div class="drawer-sep"></div>
      <button type="button" class="drawer-item" id="btn-theme" aria-label="Toggle theme">Theme</button>
      <button type="button" class="drawer-item" id="btn-update" title="Check GitHub for a newer version and install it">Updates</button>
      <button type="button" class="drawer-item needs-unlock" id="btn-password" title="Change password">Password</button>
      <button type="button" class="drawer-item needs-unlock" id="btn-lock" title="Lock the app; the password is needed to open it again">Lock</button>
    </div>
  </aside>
  <button type="button" class="fab needs-unlock" id="btn-add-fund" aria-label="Add a holding" title="Add a mutual fund, stock, NPS, EPF, PPF, gold bond, fixed deposit or policy">+</button>
  <main id="app"></main>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
