<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Investment Tracker</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">Investment Tracker <span class="version muted" id="app-version" title="App version"></span></a>
    <nav><a href="#/">Portfolio</a></nav>
    <div class="actions">
      <button type="button" class="btn ghost small" id="btn-theme" aria-label="Toggle theme">Theme</button>
      <button type="button" class="btn ghost small needs-unlock" id="btn-password" title="Change password">Password</button>
      <button type="button" class="btn ghost small needs-unlock" id="btn-cloud" title="Back up the vault to Google Drive, OneDrive or Dropbox">Cloud</button>
      <button type="button" class="btn ghost small needs-unlock" id="btn-lock" title="Lock the app; the password is needed to open it again">Lock</button>
      <button type="button" class="btn ghost small needs-unlock" id="btn-refresh" title="Fetch the latest NAVs, stock prices and exchange rates">Refresh prices</button>
      <button type="button" class="btn primary small needs-unlock" id="btn-add-fund">+ Add fund / stock</button>
    </div>
  </header>
  <main id="app"></main>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
